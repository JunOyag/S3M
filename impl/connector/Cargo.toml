[package]
name = "p2p-storage-connector"
version = "0.1.0"
edition = "2021"
description = "Connecteur (client) P2P-Storage — binaire Rust natif, spec V3."
license = "MIT"

[lib]
name = "p2p_storage_connector"

[dependencies]
futures = "0.3"
getrandom = "0.2"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519"] }
p2p-storage-core = { path = "../core" }
p2p-storage-protocol = { path = "../protocol" }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
ed25519-dalek = "2"
flatbuffers = "=23.5.26"
p2p-storage-node = { path = "../node" }

[features]
default = []
vdf = ["p2p-storage-core/vdf"]
