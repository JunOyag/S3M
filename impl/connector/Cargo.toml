[package]
name = "s3m-connector"
version = "0.1.0"
edition = "2021"
description = "Connecteur (client) S3m — binaire Rust natif, spec V3."
license = "MIT"

[lib]
name = "s3m_connector"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
ed25519-dalek = "2"
futures = "0.3"
flatbuffers = "=23.5.26"
getrandom = "0.2"
hex = "0.4"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519", "request-response", "identify", "relay", "dcutr", "quic", "mdns", "json"] }
s3m-core = { path = "../core" }
s3m-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

[target.'cfg(windows)'.dependencies]
winfsp = { version = "=0.13.2", optional = true }
widestring = { version = "1", optional = true }
tray-icon = { version = "=0.26.1", optional = true }
tao = { version = "=0.37.3", optional = true }
winreg = { version = "=0.56.0", optional = true }
tauri-winrt-notification = { version = "=0.8.1", optional = true }
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO"] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "=0.13.2", optional = true, default-features = false, features = ["delayload"] }
embed-resource = { version = "=3.0.12", optional = true }

[dev-dependencies]
s3m-node = { path = "../node" }

[features]
default = []
vdf = ["s3m-core/vdf"]
# Lecteur monté Windows (WinFsp installé ; LLVM pour la compilation).
mount = ["dep:winfsp", "dep:widestring"]
# Mode dossier Windows (Cloud Files), sans WinFsp ni droit d'administration.
folder = ["dep:windows"]
# Application de la barre des tâches S3m.exe (Windows).
tray = ["mount", "folder", "dep:tray-icon", "dep:tao", "dep:winreg", "dep:tauri-winrt-notification", "dep:embed-resource"]

[[bin]]
name = "S3m"
path = "src/bin/S3m.rs"
required-features = ["tray"]

[[bin]]
name = "s3m-connector"
path = "src/bin/s3m-connector.rs"
