[package]
name = "s3m-connector"
version = "0.1.0"
edition = "2021"
description = "Connecteur (client) S3m — binaire Rust natif, spec V3."
license = "MIT"

[lib]
name = "s3m_connector"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
ed25519-dalek = "2"
futures = "0.3"
flatbuffers = "=23.5.26"
getrandom = "0.2"
hex = "0.4"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519", "request-response", "identify", "relay", "dcutr", "quic"] }
s3m-core = { path = "../core" }
s3m-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

[target.'cfg(windows)'.dependencies]
winfsp = { version = "=0.13.2", optional = true }
widestring = { version = "1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "=0.13.2", optional = true, default-features = false, features = ["delayload"] }

[dev-dependencies]
s3m-node = { path = "../node" }

[features]
default = []
vdf = ["s3m-core/vdf"]
# Lecteur monté Windows (WinFsp installé ; LLVM pour la compilation).
mount = ["dep:winfsp", "dep:widestring"]
