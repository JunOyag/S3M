[package]
name = "p2p-storage-connector"
version = "0.1.0"
edition = "2021"
description = "Connecteur (client) P2P-Storage — binaire Rust natif, spec V3."
license = "MIT"

[lib]
name = "p2p_storage_connector"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
ed25519-dalek = "2"
futures = "0.3"
flatbuffers = "=23.5.26"
getrandom = "0.2"
hex = "0.4"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519", "request-response"] }
p2p-storage-core = { path = "../core" }
p2p-storage-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

[dev-dependencies]
p2p-storage-node = { path = "../node" }

[features]
default = []
vdf = ["p2p-storage-core/vdf"]
