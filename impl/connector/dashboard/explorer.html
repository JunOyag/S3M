<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Explorateur S3m</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --card: #ffffff; --accent: #2f5d8a; --bad: #a4302a; --drop: #e6eef6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d; --accent: #7fb0e0; --bad: #e07a72; --drop: #23303b; }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  .crumbs { flex: 1 1 240px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; min-width: 0; }
  .crumbs button { background: none; border: none; color: var(--accent); padding: 2px 4px; cursor: pointer; font: inherit; }
  .crumbs button.drop-target { background: var(--drop); border-radius: 4px; }
  .crumbs span { color: var(--muted); }
  button.act { background: var(--accent); color: var(--card); border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button.act.secondary { background: none; color: var(--accent); border: 1px solid var(--line); }
  button.small { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 5px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  button.small.danger { color: var(--bad); }
  main { padding: 12px 16px; }
  #zone { border: 2px dashed transparent; border-radius: 8px; min-height: 60vh; }
  #zone.dragover { border-color: var(--accent); background: var(--drop); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tr.row:hover { background: var(--drop); }
  tr.drop-target { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.name { cursor: pointer; word-break: break-word; }
  td.name .ico { display: inline-block; width: 1.4em; }
  td.num, th.num { text-align: right; white-space: nowrap; color: var(--muted); }
  td.acts { white-space: nowrap; text-align: right; }
  td.acts { width: 1%; }
  button.more { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 5px; padding: 0 8px; cursor: pointer; font: inherit; font-size: 18px; line-height: 1.4; }
  button.more:hover, button.more:focus-visible { border-color: var(--line); color: var(--fg); }
  .menu { position: fixed; z-index: 10; min-width: 190px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px #0003; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--fg); padding: 6px 10px; border-radius: 5px; cursor: pointer; font: inherit; }
  .menu button:hover, .menu button:focus-visible { background: var(--drop); outline: none; }
  .menu button.danger { color: var(--bad); }
  .muted { color: var(--muted); }
  .tag { font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 6px; }
  .tag.old { color: var(--bad); border-color: var(--bad); }
  #oldkey { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--bad); }
  #oldkey span { flex: 1 1 240px; }
  #status { min-height: 1.5em; padding: 6px 16px; color: var(--muted); font-size: 13px; }
  #status.err { color: var(--bad); }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; max-width: min(560px, 92vw); }
  dialog::backdrop { background: #0006; }
  dialog label { display: block; margin: 8px 0; }
  dialog input, dialog textarea { width: 100%; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  dialog .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--drop); border-bottom: 1px solid var(--line); }
  #banner strong { flex: 1 1 240px; }
  dialog table { margin-top: 8px; }
  @media (max-width: 640px) { td.num.date, th.num.date { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <nav class="crumbs" id="crumbs" aria-label="Emplacement"></nav>
  <button class="act secondary" id="versions" type="button" title="Parcourir et restaurer les versions passées de vos fichiers (rançongiciel, suppression par erreur)">Revenir en arrière</button>
  <button class="act secondary" id="mkdir" type="button">Nouveau dossier</button>
  <button class="act secondary" id="upfolder" type="button">Envoyer un dossier</button>
  <button class="act" id="upfiles" type="button">Envoyer des fichiers</button>
  <input type="file" id="pickfiles" multiple hidden>
  <input type="file" id="pickfolder" webkitdirectory multiple hidden>
</div>
<div id="banner" hidden>
  <strong id="bannertext"></strong>
  <button class="act secondary" id="restoredir" type="button">Restaurer ce dossier</button>
  <button class="act secondary" id="restoreall" type="button">Restaurer tout l'espace à cette version</button>
  <button class="act" id="current" type="button">Revenir à la version actuelle</button>
</div>
<div id="oldkey" hidden>
  <span id="oldkeytext"></span>
  <button class="act" id="reencryptall" type="button">Tout rechiffrer ici</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
<main>
  <div id="zone">
    <table>
      <thead><tr><th>Nom</th><th class="num">Taille</th><th class="num date">Modifié</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted" id="hint">Glissez des fichiers ou des dossiers ici pour les envoyer ; glissez un élément sur un dossier (ou sur l'emplacement en haut) pour l'y déplacer.</p>
  </div>
</main>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<script src="explorer.js"></script>
</body>
</html>
