    status: not_started
    owner: null
    tests: []
    notes: ''
  crypto.identity-derivation:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - identity_derivation_vectors::bip39_seed_matches_trezor_vector_trezor_passphrase
      - identity_derivation_vectors::bip39_seed_matches_trezor_vector_empty_passphrase
      - identity_derivation_vectors::bip39_seed_matches_trezor_vector_second_mnemonic
      - identity_derivation_vectors::slip10_master_key_matches_spec_vector
      - identity_derivation_vectors::slip10_hardened_child_matches_spec_vector
      - identity_derivation_vectors::purpose_hardened_serialization_is_0x80703270
      - identity_derivation_vectors::identity_derivation_is_deterministic
      - identity_derivation_vectors::roles_are_domain_separated
      - identity_derivation_vectors::identity_index_rotation_changes_the_key
      - identity_derivation_vectors::node_recovery_key_accompanies_node_index_without_reuse
      - identity_derivation_vectors::master_key_versions_are_independent_and_bounded
      - identity_derivation_vectors::wrong_passphrase_yields_a_different_identity_without_error
      - identity_derivation_vectors::out_of_range_hardened_index_is_rejected
    notes: >-
      Chaîne BIP-39 -> SLIP-0010 ed25519 implémentée dans impl/core :
      PBKDF2-HMAC-SHA512 (2048 it., sel "mnemonic"+passphrase, composé sur
      hmac/sha2 sans dépendance additionnelle) -> HMAC-SHA512(clé="ed25519
      seed") -> m/0x703270'/{0'|1'|2'|3'}'/<index>' entièrement durci. Rôle
      3' = master_key[version] (u16), raccourci typé derive_master_key —
      master_key_chain reste l'unique lecture des versions historiques.
      Vecteurs externes : Trezor BIP-39 (3) + SLIP-0010 ed25519 "Test vector
      2" (seed 64 o, m + m/0'). Normalisation NFKD présumée côté appelant
      ( Connecteur TS ) ; balayage DHT de découverte d'index hors périmètre
      noyau (I/O — network.bootstrap). Variantes d'erreur dédiées ajoutées à
      error.rs : IdentityDerivation, InvalidDerivationIndex.
  crypto.master-key-chain:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - master_key_chain_vectors::flat_rewrap_then_resolve_recovers_historical_keys
      - master_key_chain_vectors::resolve_stays_single_unwrap_after_many_rotations
      - master_key_chain_vectors::transplanted_version_fails_tag_verification
      - master_key_chain_vectors::unknown_version_is_rejected_explicitly
      - master_key_chain_vectors::chain_entries_carry_their_wrapped_version
    notes: >-
      Passe code effectuée : rewrap_chain_on_rotation (re-wrap plat,
      maillons triés, 48 o sans en-tête) + resolve_master_key (recherche
      par version, 1 unwrap, UnknownKeyVersion/UnwrapFailure) — K_wrap
      réutilisé de symmetric_suite (jamais redérivé), en-tête u16 BE v1 en
      paramètre (formats-serialisation). Revue cryptographique validée.
  crypto.symmetric-suite:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - labels::info_labels_are_globally_unique
      - labels::aad_contexts_are_unique
      - labels::labels_match_the_spec_registry
      - symmetric_suite_vectors::aead_seal_matches_rfc8439_section_2_8_2
      - symmetric_suite_vectors::aead_open_rejects_forgery
      - symmetric_suite_vectors::hkdf_sha256_matches_rfc5869_vectors
      - symmetric_suite_vectors::hmac_sha256_matches_rfc4231_vectors
      - symmetric_suite_vectors::sha256_matches_rfc6234_vectors
      - symmetric_suite_vectors::canonical_encode_matches_spec_layout
      - symmetric_suite_vectors::k_nonce_matches_generated_composition_vector
      - symmetric_suite_vectors::k_wrap_matches_generated_composition_vector
      - symmetric_suite_vectors::k_block_single_label_info_matches_generated_composition_vector
      - symmetric_suite_vectors::synthetic_nonce_matches_generated_composition_vector
      - symmetric_suite_vectors::wrap_composition_is_48_octets_without_header
      - symmetric_suite_vectors::block_frame_matches_generated_composition_vector
    notes: >-
      Revue cryptographique validée (régimes AEAD/HKDF/hash,
      politique de nonce et nonce synthétique arbitrés, SPEC_GAPS
      crypto.k-block/k-dispersal résolu). Registre des étiquettes KDF
      (unicité globale, 13 étiquettes dont la nouvelle
      p2p-storage/master-key-wrap/v1, exception K_attach réservée à la v1
      X25519) et registre distinct des contextes d'AAD (master-key-wrap,
      block, contextes par clé) intégrés à la page ; clé de wrap K_wrap
      (HKDF sans sel, ChaCha20-Poly1305 nonce nul, wrapped_key 48 o sans
      en-tête, l'en-tête de version n'entrant que dans l'AAD) spécifiée.
      Passe code effectuée : primitives liées (crates chacha20poly1305,
      hkdf, hmac, sha2 — jamais réimplémentées), registres dans
      src/labels.rs, nonce synthétique et K_wrap dans
      src/symmetric_suite.rs ; vecteurs RFC 8439 §2.8.2, RFC 5869 A.1-A.3,
      RFC 4231 TC1-TC4, RFC 6234 §8.5 + compositions générées par
      tests/vectors/gen_symmetric_suite_vectors.py (cryptography,
      indépendante du code testé) — 15 tests verts (cargo test).
      verified_by renseigné dans manifest.yml (15 identifiants de test).
