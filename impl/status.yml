  crypto.k-attach:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - rfc_vectors::ed25519_to_x25519_matches_libsodium_conversion_vectors
      - rfc_vectors::pub_conversion_rejects_small_order_points
      - rfc_vectors::x25519_dh_matches_rfc7748_vectors
      - rfc_vectors::ed25519_key_derivation_matches_rfc8032_vectors
      - rfc_vectors::k_attach_is_symmetric_between_user_and_node
      - rfc_vectors::k_attach_derivation_is_deterministic_and_salt_dependent
      - rfc_vectors::sig_priv_dispersal_is_deterministic_and_domain_separated
    notes: >-
      Conversion Ed25519->X25519 (graine 32B, clamp(SHA-512(graine)[0..32]),
      équivalent crypto_sign_ed25519_sk/pk_to_curve25519) + dérivation K_attach
      (HKDF-SHA256, salt fixé par le Connecteur, info vide) + sig_priv_dispersal
      (info "dispersal-signing"). Vecteurs externes cités : RFC 7748 §5.2,
      RFC 8032 §7.1, libsodium test/default/ed25519_convert. derive_sig_priv_user
      (§3.9) volontairement laissée en todo!() — spec vivant sur
      network.dht-directory (Phase 2). Voir SPEC_GAPS.md pour le chemin
      BIP-39 -> graine 32B (non bloquant).
  crypto.k-block:
    kind: narrative
    status: not_started
    owner: cline-agent
    tests:
      - k_block_vectors::k_block_derivation_is_deterministic
      - k_block_vectors::k_block_differs_per_block_hash
      - k_block_vectors::k_block_differs_per_encryption_salt
      - k_block_vectors::k_block_differs_per_master_key_version
    notes: >-
      Formule révisée par l'arbitrage symmetric-suite (impl/SPEC_GAPS.md,
      doc e13b2e7) : K_block = KDF(master_key[version], encryption_salt),
      sans block_hash — clé par élément, blocs déterministes à nonce
      synthétique (voir crypto.symmetric-suite). Entrée rouverte : le code
      (impl/core/src/k_block.rs, commit 194d653 sur main) et les tests
      ci-dessus encodent encore l'ancienne formule info=block_hash —
      passe code requise. Revue cryptographique requise avant done.
  crypto.k-dispersal:
    kind: narrative
    status: not_started
    owner: cline-agent
    tests:
      - k_dispersal_vectors::k_dispersal_derivation_is_deterministic
      - k_dispersal_vectors::k_dispersal_block_differs_per_block_hash
      - k_dispersal_vectors::k_dispersal_content_is_domain_separated_from_k_attach_and_signing_key
    notes: >-
      Formule révisée par l'arbitrage symmetric-suite (impl/SPEC_GAPS.md,
      doc e13b2e7) : K_dispersal_content = KDF(K_attach,
      "dispersal-content"), K_dispersal_block = KDF(K_dispersal_content,
      "dispersal-block") — étiquette de domaine fixe, sans block_hash ;
      blocs de l'arbre d'index en déterministe à nonce synthétique.
      Entrée rouverte : le code (impl/core/src/k_dispersal.rs, commit
      6b6ee07 sur main) et les tests ci-dessus encodent encore
      info=block_hash — passe code requise. Revue cryptographique requise
      avant done.
  crypto.k-node-self:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - k_node_self_vectors::k_node_self_derivation_is_deterministic
      - k_node_self_vectors::k_node_self_differs_per_priv_node
      - k_node_self_vectors::k_node_self_is_domain_separated_from_k_self
    notes: >-
      K_node_self = HKDF-SHA256(priv_node, info="node-recovery"), salt
      interne par défaut, sortie 32 octets. Symétrique de K_self côté Nœud,
      dérivable de la seed seule (restauration). Domaine séparé de
      "attachment-recovery" testé. Dérivation propre au protocole :
      invariants structurels seuls, graines RFC 8032 en entrée seulement.
  crypto.k-self:
    kind: narrative
    status: done
    owner: cline-agent
    tests:
      - k_self_vectors::k_self_derivation_is_deterministic
      - k_self_vectors::k_self_differs_per_priv_user
    notes: >-
      K_self = HKDF-SHA256(priv_user, info="attachment-recovery"), salt
      interne par défaut, sortie 32 octets. Ne dépend d'aucune info externe
      (reconstruction depuis la seed seule). Dérivation propre au protocole :
      invariants structurels seuls, graines RFC 8032 en entrée seulement.
