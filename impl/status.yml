  network.vdf-identity:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - vdf_smoke::roundtrip_verifies_with_protocol_constants
      - vdf_smoke::roundtrip_verifies_with_fast_t
      - vdf_smoke::proof_is_rejected_for_another_identity
      - vdf_smoke::proof_is_rejected_when_a_byte_is_altered
      - vdf_smoke::proof_is_rejected_with_wrong_t
      - vdf_smoke::proof_is_rejected_with_nonzero_recursion
      - vdf_smoke::verification_with_t_max_is_bounded_and_rejected
      - vdf_smoke::empty_and_truncated_proofs_are_rejected
      - vdf_smoke::random_bytes_proof_is_rejected
      - vdf_smoke::t_zero_is_rejected_before_any_ffi_call
      - vdf_smoke::tagged_identity_is_one_algorithm_octet_followed_by_the_raw_key
      - vdf_smoke::unsupported_and_unknown_key_algorithms_are_rejected_with_dedicated_errors
    notes: >-
      Spec V3 : API sur identité marquée key_algorithm || clé (33 o) ;
      tagged_identity et check_key_algorithm (tag 0 seul accepté, 1/2
      UnsupportedKeyAlgorithm, autres UnknownKeyAlgorithm) ; challenge =
      SHA-256(identité). Binding chiavdf inchangé (λ=1024, T=5 400 000,
      recursion 0). Tests --features vdf exécutés sous Docker (impl/docker-
      test.sh, rust:1-bookworm) : 12/12, clippy -D warnings vert.
