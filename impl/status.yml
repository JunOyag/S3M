  crypto.k-attach:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - rfc_vectors::x25519_dh_matches_rfc7748_vectors
      - rfc_vectors::ed25519_key_derivation_matches_rfc8032_vectors
      - rfc_vectors::ed25519_to_x25519_matches_libsodium_conversion_vectors
      - rfc_vectors::pub_conversion_rejects_small_order_points
      - rfc_vectors::k_attach_is_symmetric_between_user_and_node
      - rfc_vectors::k_attach_derivation_is_deterministic_and_salt_dependent
      - rfc_vectors::sig_priv_dispersal_is_deterministic_and_domain_separated
      - rfc_vectors::k_attach_matches_generated_vector
      - rfc_vectors::sig_priv_dispersal_matches_generated_vector
    notes: >-
      Spec V3 : K_attach = KDF(secret X25519, "attach", salt) via
      symmetric_suite::kdf ; nouvelle fonction
      derive_k_attach_from_shared_secret ; sig_priv_dispersal = KDF(K_attach,
      "dispersal-signing"). Vecteurs : RFC 7748, RFC 8032, libsodium + valeurs
      générées par cryptography. derive_sig_priv_user (keys.rs) reste à la
      tâche network.dht-directory.
  crypto.k-block:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - k_block_vectors::k_block_matches_generated_vector
      - k_block_vectors::k_block_differs_per_block_index
      - k_block_vectors::k_block_differs_per_encryption_salt
      - k_block_vectors::k_block_differs_per_master_key_version
      - k_block_vectors::k_block_rejects_salt_of_wrong_length
      - k_block_vectors::block_frame_matches_generated_vector_and_is_65536_octets
      - k_block_vectors::block_rejects_oversized_plaintext_and_wrong_frame_size
      - k_block_vectors::block_tampering_is_rejected
    notes: >-
      Spec V3 : K_block = KDF(master_key, "block", encryption_salt 16 o,
      u32(index)) ; seal_block/open_block : trame exacte de 65 536 o (en-tête
      2 o ‖ nonce 12 o ‖ chiffré ‖ tag), AAD = en-tête, padding zéro jusqu'à
      65 506 o. Vecteurs générés par cryptography. La mesure de
      FILE_BLOCK_DATA_BYTES exige la sérialisation FlatBuffers de FileBlock :
      elle est portée par l'id fs.FileBlock (Phase 1, impl/protocol).
  crypto.k-dispersal:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - k_dispersal_vectors::k_dispersal_derivation_is_deterministic
      - k_dispersal_vectors::k_dispersal_content_is_domain_separated_from_k_attach_and_signing_key
      - k_dispersal_vectors::k_dispersal_matches_generated_vectors
      - k_dispersal_vectors::k_dispersal_block_differs_per_index_node_salt
    notes: >-
      Spec V3 : K_dispersal_content = KDF(K_attach, "dispersal-content") ;
      K_dispersal_block = KDF(K_dispersal_content, "dispersal-block",
      sel_du_nœud), sel de 16 o obligatoire (CoreError::InvalidSaltLength).
      Vecteurs générés par cryptography.
  crypto.k-node-self:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - k_node_self_vectors::k_node_self_derivation_is_deterministic
      - k_node_self_vectors::k_node_self_differs_per_priv_node
      - k_node_self_vectors::k_node_self_is_domain_separated_from_k_self
      - k_node_self_vectors::k_node_self_matches_generated_vector
    notes: >-
      Spec V3 : K_node_self = KDF(priv_node, "node-recovery") via
      symmetric_suite::kdf. Vecteur généré par cryptography.
  crypto.k-self:
    kind: narrative
    status: done
    owner: claude-code
    tests:
      - k_self_vectors::k_self_derivation_is_deterministic
      - k_self_vectors::k_self_differs_per_priv_user
      - k_self_vectors::k_self_matches_generated_vector
    notes: >-
      Spec V3 : K_self = KDF(priv_user, "attachment-recovery") via
      symmetric_suite::kdf. Vecteur généré par cryptography.
  crypto.key-hierarchy:
