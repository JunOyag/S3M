      - local_api::http_requests_require_bearer_token_host_and_matching_origin
      - local_api::websocket_checks_handshake_then_first_message_token
      - daemon::node_starts_serves_a_guarded_dashboard_and_persists_its_state
      - daemon::saved_state_roundtrips_users_partners_and_addresses
      - daemon::connector_watches_its_node_keeps_a_rescue_grant_and_serves_its_dashboard
      - lan::local_node_is_found_by_mdns_and_confirmed_by_probe
    notes: >-
      Livrés (2026-11-20) : exécutables s3m-node et
      s3m-connector (init + config JSON, phrase de récupération BIP-39),
      stockage disque du Nœud, état persistant, API locale HTTP/WebSocket
      protégée (local_api), dashboards statiques servis par les binaires, image
      Docker du Nœud (impl/node/Dockerfile). 2026-11-21 : dashboards complets
      (taux de republication DHT, espace de secours, écriture d'urgence,
      espace de l'Utilisateur et taille réelle du lecteur) ; snapshot du Nœud, dispersion, contrôles et
      publication des entrées DHT Node/User (VDF natif Windows) livrés —
      voir impl/SPEC_GAPS.md.
      2026-11-20 : application de barre des tâches S3m.exe (icône d'état, menu,
      notifications, démarrage avec Windows, instance unique, assistant de
      premier lancement avec recherche mDNS des Nœuds locaux), logo intégré ;
      essai réel du premier lancement au rattachement et à la synchronisation.
