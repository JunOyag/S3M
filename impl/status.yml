# impl/status.yml — suivi d'implémentation (code), séparé de manifest.yml (doc).
# Généré une fois par scripts/init_impl_status.py, puis édité manuellement par
# les agents au fil du chantier. Ne pas régénérer après le lancement du projet
# (écraserait la progression) — le script refuse d'écraser un fichier existant.

