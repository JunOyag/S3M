[package]
name = "s3m-protocol"
version = "0.1.0"
edition = "2021"
description = "Logique protocolaire partagée par le Nœud et le Connecteur (types FlatBuffers générés, enveloppes DHT, règles communes), sans I/O — spec V3."
license = "MIT"

[lib]
name = "s3m_protocol"

[dependencies]
# Même version que flatc (paquet Debian flatbuffers-compiler), voir gen.sh.
flatbuffers = "=23.5.26"
ed25519-dalek = "2"
thiserror = "1"
s3m-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
# Coffre local des phrases secrètes (feature `vault`, deploiement.packaging#coffre-local).
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native", "apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hex = "0.4"

[features]
default = []
vdf = ["s3m-core/vdf"]
vault = ["dep:argon2", "dep:chacha20poly1305", "dep:getrandom", "dep:hex", "dep:zeroize", "dep:keyring"]
