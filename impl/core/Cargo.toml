[package]
name = "s3m-core"
version = "0.1.0"
edition = "2021"
description = "Primitives cryptographiques et structurelles du protocole P2P (ST-S3M-2026, spec V3), sans I/O réseau ni disque."
license = "MIT"

# rlib natif, lié par impl/node, impl/protocol et impl/connector (spec V3 :
# plus de cible WASM).
[lib]
name = "s3m_core"
crate-type = ["rlib"]

[dependencies]
chiavdf = { version = "1.1.14", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Ré-export de la même famille de courbes que ed25519-dalek/x25519-dalek —
# utilisé par keys.rs pour la biration Edwards->Montgomery (RFC 7748 §6.1).
curve25519-dalek = "4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
# Suite symétrique (crypto.symmetric-suite) : AEAD ChaCha20-Poly1305 (RFC 8439)
# et HMAC-SHA256 (nonce synthétique, RFC 4231). Features minimales : le noyau
# ne tire jamais d'aléa (aucun `OsRng`/`getrandom` — la politique de nonce
# aléatoire est appliquée par l'appelant), la cible WASM reste donc intacte.
# Voir impl/TECH_STACK.md.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
# Reed-Solomon GF(2^8) — lié, jamais réimplémenté (impl/TECH_STACK.md).
reed-solomon-erasure = "6"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
# VDF (network.vdf-identity, Phase 0) : la crate `chiavdf` compile du C++ par
# CMake (MPIR sous Windows, GMP ailleurs) et génère ses bindings avec
# bindgen/libclang (outillage : impl/TECH_STACK.md, « Environnement de build
# et CI »). Optionnelle, feature `vdf` non active par défaut : un `cargo test`
# local sans outillage C++ reste vert (CoreError::VdfUnavailable) ; tests
# complets en CI ou sous Docker (impl/docker-test.sh).

[features]
default = []
vdf = ["dep:chiavdf"]

[dev-dependencies]
hex = "0.4"

[[example]]
name = "gen_vdf_fixture"
required-features = ["vdf"]
