<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>S3m</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --card: #ffffff; --accent: #2f5d8a; --bad: #a4302a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d; --accent: #7fb0e0; --bad: #e07a72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  #live { color: var(--muted); font-size: 12px; }
  main { padding: 16px 24px; display: grid; gap: 16px; max-width: 1200px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; overflow-x: auto; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .empty { color: var(--muted); font-style: italic; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); min-width: 200px; }
  button { font: inherit; padding: 5px 12px; border: 0; border-radius: 4px; background: var(--accent); color: var(--bg); cursor: pointer; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<header><h1 id="title">S3m</h1><span id="live">connexion…</span></header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
