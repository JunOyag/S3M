<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>S3m</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --card: #ffffff; --accent: #2f5d8a; --bad: #a4302a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d; --accent: #7fb0e0; --bad: #e07a72; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d; --accent: #7fb0e0; --bad: #e07a72; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  /* `hidden` l'emporte sur les `display` ci-dessous (onglets, champs conditionnels). */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  #live { color: var(--muted); font-size: 12px; }
  main { padding: 16px 24px; display: grid; gap: 16px; max-width: 1200px; align-content: start; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; overflow-x: auto; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .empty { color: var(--muted); font-style: italic; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); min-width: 200px; }
  button { font: inherit; padding: 5px 12px; border: 0; border-radius: 4px; background: var(--accent); color: var(--bg); cursor: pointer; }
  .error { color: var(--bad); }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: progress; }
  button.small { padding: 3px 10px; font-size: 12px; }
  td { white-space: pre-line; }
  img.qr { width: 220px; height: 220px; background: #fff; border-radius: 6px; }
  .toast a { color: inherit; font-weight: 600; margin-left: 6px; }
  .row-actions { white-space: nowrap; font-family: inherit; }
  .form { border-top: 1px solid var(--line); padding-top: 10px; }
  .form:first-of-type { border-top: 0; }
  .form h3 { width: 100%; margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .form.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }
  .form.grid button { justify-self: start; align-self: end; }
  label.check { display: flex; flex-direction: row; align-items: center; gap: 8px; color: var(--fg); }
  label.check input { min-width: 0; }
  #toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 10; max-width: min(420px, calc(100vw - 40px)); }
  .toast { padding: 10px 14px; border-radius: 6px; background: var(--card); color: var(--fg); border-left: 4px solid #2e9d5b;
           box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
  .toast.error { border-left-color: var(--bad); }
  .toast.show { opacity: 1; transform: none; }
  /* Écrans et menu */
  .table-box { display: grid; gap: 6px; }
  .table-foot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .table-foot:empty { display: none; }
  .muted { color: var(--muted); font-size: 12px; }
  td.long { min-width: 260px; }
  .row-actions button { margin: 1px 2px; }
  dialog.panel { border: none; border-radius: 10px; background: var(--card); color: var(--fg); padding: 18px 22px; width: min(560px, 92vw); max-height: 88vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  dialog.panel.wide { width: min(1100px, 96vw); }
  .kv-note { margin: 6px 0 4px; max-width: 70ch; }
  dialog.panel::backdrop { background: rgba(0,0,0,.45); }
  dialog.panel .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  dialog.panel .panel-head h2 { margin: 0; font-size: 18px; }
  dialog.panel form { margin: 12px 0; }
  ol.words { display: grid; grid-template-columns: repeat(4, max-content); gap: 4px 28px; margin: 4px 0; padding-left: 2.2em; font-family: ui-monospace, Consolas, monospace; }
  ol.words li { padding-left: 4px; }
  iframe.frame { width: 100%; height: calc(100vh - 170px); min-height: 420px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .frame-link { font-size: 12px; color: var(--accent); justify-self: end; }
  body.with-menu { display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
  body.with-menu header { grid-column: 1 / -1; }
  #menu { padding: 16px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start; }
  #menu button { background: transparent; color: var(--fg); text-align: left; padding: 8px 12px; border-radius: 6px; font-weight: 500; }
  #menu button:hover { background: var(--card); filter: none; }
  #menu button.active { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  .page-title { font-size: 20px; margin: 4px 0 0; color: var(--fg); }
  main > * { min-width: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 12px; }
  .card { display: grid; gap: 4px; align-content: start; text-align: left; background: var(--card); color: var(--fg); border: 1px solid var(--line);
          border-left: 4px solid var(--line); border-radius: 8px; padding: 12px 14px; font: inherit; }
  button.card { cursor: pointer; }
  button.card:hover { filter: none; border-color: var(--accent); }
  .card.ok { border-left-color: #2e9d5b; }
  .card.attention { border-left-color: #c58a1a; }
  .card.probleme { border-left-color: var(--bad); }
  .card-label { color: var(--muted); font-size: 12px; }
  .card-value { font-size: 18px; font-weight: 600; word-break: break-word; }
  .card-detail { color: var(--muted); font-size: 12px; }
  td table.kv { margin: -2px 0; }
  td table.kv th, td table.kv td { border-bottom: 0; padding: 2px 8px 2px 0; }
  @media (max-width: 760px) {
    body.with-menu { display: block; }
    #menu { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); position: static; padding: 8px 16px; }
    #menu button { white-space: nowrap; }
    #menu button.active { box-shadow: inset 0 -3px 0 var(--accent); }
    main { padding: 16px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    th { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.tip{opacity:.55;font-size:.85em;cursor:help;font-weight:normal}
[title]{cursor:help}
th[data-col]{cursor:pointer}
td.short{white-space:nowrap}
  /* Panneaux, formulaires, tableaux (2026-11-22) */
  .row-actions .row-input { width: 11em; margin: 1px 2px; font: inherit; }
  textarea, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  textarea { width: 100%; min-height: 6em; resize: vertical; }
  label.wide { grid-column: 1 / -1; width: 100%; }
  .path-row { display: flex; gap: 6px; align-items: center; }
  .path-row input { flex: 1; min-width: 0; }
  .path-space { font-size: 12px; }
  .short-input { min-width: 0; width: 7em; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: var(--bad); }
  .row-actions button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .table-tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .table-filter { min-width: 220px; }
  .page-size { display: flex; flex-direction: row; align-items: center; gap: 6px; }
  .page-size-other { min-width: 0; width: 6em; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td, tr.clickable:focus td { background: color-mix(in srgb, var(--accent) 9%, transparent); outline: none; }
  blockquote.message { margin: 8px 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--bg); white-space: pre-wrap; word-break: break-word; border-radius: 4px; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .tabs .tab { background: transparent; color: var(--muted); border-radius: 6px 6px 0 0; padding: 7px 14px; font-weight: 500; }
  .tabs .tab[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .browser-bar, .browser-new { display: flex; gap: 6px; margin: 6px 0; }
  .browser-bar input, .browser-new input { flex: 1; min-width: 0; }
  .browser-roots { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  .browser-list { list-style: none; margin: 4px 0; padding: 0; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .browser-list li { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .browser-list li:last-child { border-bottom: 0; }
  .browser-list li:hover, .browser-list li:focus { background: color-mix(in srgb, var(--accent) 10%, transparent); outline: none; }
  .browser-list li.empty { cursor: default; }
  dialog.panel { width: min(640px, 94vw); }
  .form-text { width: 100%; margin: 0 0 4px; color: var(--muted); font-size: 12px; }
  section.callout { border: 1px solid #c58a1a; border-left: 5px solid #c58a1a; background: color-mix(in srgb, #c58a1a 8%, var(--card)); }
  section.callout h3 { color: var(--fg); font-size: 15px; }
  section.callout .form-text { color: var(--fg); font-size: 13px; margin: 0; }
  .callout-forms { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .callout-forms form { border: 0; padding: 0; margin: 0; }
  .callout-forms form:first-child { flex: 1 1 320px; }
  section.callout button[type=submit]:not(.secondary) { font-size: 15px; padding: 8px 18px; font-weight: 600; }
  .section-body { display: grid; gap: 10px; }
  tr.unread td { font-weight: 700; }
  tr.unread td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .send-delay { display: inline-flex; gap: 10px; align-items: center; }
  .send-delay .muted { font-size: 13px; color: var(--fg); font-weight: 600; }
  textarea.to-copy { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 5em; word-break: break-all; margin: 8px 0; }
  .browser-list li.file { color: var(--muted); }
  .mode-switch { margin-left: auto; margin-right: 12px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  /* Logo transparent : fond blanc pour le thème foncé. */
  #title-wrap img { background: #fff; border-radius: 7px; padding: 2px; box-sizing: content-box; }
  /* Interrupteurs à la manière d'iOS (toutes les cases à cocher). */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; min-width: 0; padding: 0; width: 42px; height: 24px; margin: 0; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; vertical-align: middle; transition: background .2s; border: none; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .2s; }
  input[type=checkbox]:checked { background: #34c759; }
  input[type=checkbox]:checked::after { transform: translateX(18px); }
  input[type=checkbox]:disabled { opacity: .5; cursor: default; }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.check { display: flex; align-items: center; gap: 10px; }
  .mode-switch { display: inline-flex; align-items: center; gap: 8px; align-self: center; }
  input.bad { border-color: var(--bad, #c0392b); }
  details.foldable > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  .tab-pane > form + form { margin-top: 18px; }
  .date-filter { display: flex; align-items: center; gap: 6px; }
  .date-filter .table-filter { min-width: 0; }
  .mode-switch input { vertical-align: middle; }
  .theme-switch { align-self: center; }
  .form-buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .form-buttons > form, .form-buttons > .form-button { margin: 0; padding: 0; border: 0; }
  /* Tableaux clé / valeur : colonnes de libellés de largeur fixe, valeurs
     alignées d'une section à l'autre (y compris dans les sous-tableaux). */
  table.kv > tbody > tr > th { width: 18em; white-space: normal; }
  td table.kv > tbody > tr > th { width: 15em; }
  .theme-switch select { font-size: 13px; padding: 3px 6px; }
  .copyable { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .copyable .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  button.copy-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 2px 5px; line-height: 0; border-radius: 4px; flex: none; }
  button.copy-btn:hover, button.copy-btn:focus-visible { color: var(--accent); border-color: var(--accent); }
  button.copy-btn.done { color: #2e9d5b; border-color: #2e9d5b; }
  dialog.confirm { width: min(460px, 92vw); }
  dialog.confirm p { margin: 8px 0 16px; white-space: pre-line; }
  .confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .alert-banner { border: 1px solid var(--bad); border-left: 6px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .alert-banner strong { color: var(--bad); font-size: 15px; display: block; }
  .alert-banner p { margin: 6px 0; }
  .alert-banner button { background: var(--bad); margin-top: 4px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 0 7px; margin-left: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<header><h1 id="title-wrap"><img src="logo.png" alt="" width="28" height="28" style="vertical-align:middle;margin-right:8px"><span id="title">S3m</span></h1><span id="live">connexion…</span></header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
