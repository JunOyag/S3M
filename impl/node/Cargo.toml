[package]
name = "p2p-storage-node"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
getrandom = "0.2"
hex = "0.4"
ed25519-dalek = "2"
flatbuffers = "=23.5.26"
futures = "0.3"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519", "request-response"] }
p2p-storage-core = { path = "../core" }
p2p-storage-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]

[features]
default = []
vdf = ["p2p-storage-core/vdf"]
