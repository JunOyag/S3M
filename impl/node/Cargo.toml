[package]
name = "s3m-node"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
getrandom = "0.2"
flate2 = "1"
maxminddb = "=0.24.0"
ureq = "2"
hex = "0.4"
ed25519-dalek = "2"
flatbuffers = "=23.5.26"
futures = "0.3"
libp2p = { version = "0.54", features = ["kad", "tcp", "noise", "yamux", "tokio", "macros", "ed25519", "request-response", "identify", "autonat", "relay", "dcutr", "quic", "mdns", "json"] }
igd-next = { version = "0.14", features = ["aio_tokio"] }
s3m-core = { path = "../core" }
s3m-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha1 = "0.10"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[features]
default = []
vdf = ["s3m-core/vdf"]
