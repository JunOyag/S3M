# =============================================================================
# manifest.yml — Source de vérité unique du plan documentaire
# =============================================================================
# Chaque page (schéma OU narrative) est déclarée UNE FOIS ici :
#   id       : identifiant stable, cible de tout $ref / lien croisé
#   kind     : "schema" (1 table FlatBuffers = 1 page) | "narrative" (protocole/procédure)
#   path     : chemin du fichier .md sous docs/
#   title    : titre affiché
#   section  : numéro §X de la spécification d'origine (traçabilité, non normatif)
#   fbs      : (schema uniquement) "fichier.fbs#Table" — source de vérité des champs
#   refs     : liste d'id vers lesquels cette page pointe ($ref sortants)
#   verified_by: liste d'identifiants de test (convention, vide tant qu'aucune
#                suite de tests n'existe réellement — cf. décision projet)
#
# gen_docs.py lit ce fichier pour :
#   1. générer build/schemas/**/*.schema.json (avec $ref JSON Pointer réels)
#      à partir des fichiers .fbs référencés par le champ `fbs`
#   2. générer docs/objects/index.json (id -> path) et la section
#      "Référencé par" de chaque page, PAR INVERSION du graphe `refs`
#      (donc jamais renseignée à la main — supprime tout doublon de maintenance)
#   3. générer le nav MkDocs (ou laisser mkdocs-awesome-pages-plugin le déduire
#      de l'arborescence, voir mkdocs.yml)
# =============================================================================

